name: Build and Publish Docker Image

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Also tag image as "latest"'
        type: boolean
        default: true
        required: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Set environment variables
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=${{ env.REGISTRY }}/${REPO_LOWER}" >> $GITHUB_ENV
          echo "REVISION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if credentials configured)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY || 'open-science-catalogue-frontend' }}
        run: |
          TAG_LATEST="${{ github.event.inputs.tag_latest }}"
          if [[ -z "$TAG_LATEST" ]]; then
            # Default to true for non-prerelease tags
            if [[ "${{ env.VERSION }}" == *-* ]]; then
              TAG_LATEST="false"
            else
              TAG_LATEST="true"
            fi
          fi

          TAGS="${{ env.GHCR_IMAGE }}:${{ env.VERSION }},${{ env.GHCR_IMAGE }}:${{ env.REVISION }}"
          if [ "$TAG_LATEST" = "true" ]; then
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:latest"
          fi

          if [ -n "$DOCKERHUB_USER" ]; then
            DH_IMAGE="${DOCKERHUB_USER}/${DOCKERHUB_REPO}"
            TAGS="${TAGS},${DH_IMAGE}:${{ env.VERSION }},${DH_IMAGE}:${{ env.REVISION }}"
            if [ "$TAG_LATEST" = "true" ]; then
              TAGS="${TAGS},${DH_IMAGE}:latest"
            fi
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
