name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Prepare external CDN & STAC Browser Web Component assets
        # NOTE: Until STAC Browser v6.0.0 is published on npm (@radiantearth/stac-browser),
        # this builds <stac-browser> from the upstream draft PR (radiantearth/stac-browser#778).
        run: npm run prepare:assets

      - name: Build static site
        env:
          SB_pathPrefix: /${{ github.event.repository.name }}/
        run: |
          npm run build
          # Copy index.html to 404.html so SPA clean URLs resolve on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
